<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121410" />
  <title>Fengyun Nexus</title>
  <style>
    :root {
      --bg0: #121410; --bg1: #1a1f18; --ink: #f2efe6; --muted: #a7b0a0;
      --line: rgba(232,165,75,.22); --amber: #e8a54b; --amber2: #c4842f; --sage: #8fad7a; --danger: #d4644a;
      --font: system-ui, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); color: var(--ink); background: linear-gradient(165deg,#121410,#1a1f18); min-height: 100vh; }
    header { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(18,20,16,.9); }
    header strong { color: var(--amber); }
    nav button { background:transparent; border:1px solid transparent; color:var(--muted); border-radius:999px; padding:8px 12px; }
    nav button.on { border-color:var(--line); color:var(--ink); background:rgba(232,165,75,.08); }
    main { max-width: 520px; margin: 0 auto; padding: 14px; }
    .panel { background:rgba(26,31,24,.92); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
    .hero { padding:16px; border-bottom:1px solid var(--line); }
    .hero h1 { margin:0 0 6px; font-size:1.25rem; }
    .hero p { margin:0; color:var(--muted); font-size:.9rem; line-height:1.45; }
    .log { min-height: 42vh; max-height: 55vh; overflow:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
    .b { max-width:92%; padding:10px 12px; border-radius:14px; white-space:pre-wrap; line-height:1.45; }
    .u { align-self:flex-end; background:rgba(232,165,75,.18); border:1px solid rgba(232,165,75,.35); }
    .a { align-self:flex-start; background:rgba(143,173,122,.12); border:1px solid rgba(143,173,122,.28); }
    .composer { display:grid; gap:8px; padding:12px; border-top:1px solid var(--line); }
    textarea, input { width:100%; border-radius:10px; border:1px solid var(--line); background:#121410; color:var(--ink); padding:10px; font:inherit; }
    textarea { min-height:64px; resize:vertical; }
    .btn { border:0; border-radius:12px; padding:12px; background:linear-gradient(180deg,var(--amber),var(--amber2)); color:#1a1208; font-weight:700; }
    .btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
    .form { display:grid; gap:10px; padding:14px; }
    .err { color: var(--danger); }
    .muted { color: var(--muted); font-size:.88rem; }
    .hide { display:none !important; }
  </style>
</head>
<body>
  <header>
    <div><strong>Fengyun Nexus</strong><div class="muted" id="envLabel">…</div></div>
    <nav>
      <button class="on" id="tabChat" type="button">对话</button>
      <button id="tabAdmin" type="button">管理</button>
    </nav>
  </header>
  <main>
    <section class="panel" id="viewChat">
      <div class="hero"><h1>框架内对话</h1><p>手机 / Termux / 电脑 / 服务器同一套网关。可直接聊；管理请切到「管理」。</p></div>
      <div class="log" id="log"></div>
      <div class="composer">
        <textarea id="input" placeholder="输入消息…"></textarea>
        <button class="btn" id="send" type="button">发送</button>
      </div>
    </section>
    <section class="panel hide" id="viewAdmin">
      <div class="hero"><h1>管理端</h1><p>初始 console / console。首次登录后用指令或本页重配账号。刷新会掉登录态。</p></div>
      <div class="form" id="loginBox">
        <input id="user" value="console" placeholder="用户名" />
        <input id="pass" type="password" placeholder="密码" />
        <div class="err" id="loginErr"></div>
        <button class="btn" id="loginBtn" type="button">登录</button>
        <p class="muted">不想改文件？电脑/服务器/Termux 可用：nexus setup / nexus env termux</p>
      </div>
      <div class="form hide" id="setupBox">
        <p class="muted">首次配置新用户名与密码（完成后请重新登录）</p>
        <input id="su" placeholder="新用户名" />
        <input id="sp" type="password" placeholder="新密码 ≥8 位" />
        <input id="sp2" type="password" placeholder="确认密码" />
        <div class="err" id="setupErr"></div>
        <button class="btn" id="setupBtn" type="button">保存并重新登录</button>
      </div>
      <div class="form hide" id="okBox">
        <p class="muted" id="okMsg">已登录</p>
        <pre class="muted" id="overview" style="overflow:auto;max-height:40vh"></pre>
        <button class="btn ghost" id="logoutBtn" type="button">退出</button>
      </div>
    </section>
  </main>
  <script>
    let token = "";
    let mustReconfigure = false;
    const log = document.getElementById("log");
    function bubble(role, text) {
      const d = document.createElement("div");
      d.className = "b " + (role === "user" ? "u" : "a");
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }
    bubble("assistant", "欢迎使用 Fengyun Nexus。");

    async function api(path, opts = {}) {
      const headers = { "content-type": "application/json", ...(opts.headers || {}) };
      if (opts.token) headers.authorization = "Bearer " + opts.token;
      const res = await fetch(path, { ...opts, headers });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || data.message || res.statusText);
      return data;
    }

    api("/v1/meta").then((m) => {
      document.getElementById("envLabel").textContent = (m.env && m.env.label) || m.env?.id || "";
    }).catch(() => {});

    document.getElementById("tabChat").onclick = () => {
      document.getElementById("tabChat").classList.add("on");
      document.getElementById("tabAdmin").classList.remove("on");
      document.getElementById("viewChat").classList.remove("hide");
      document.getElementById("viewAdmin").classList.add("hide");
    };
    document.getElementById("tabAdmin").onclick = () => {
      document.getElementById("tabAdmin").classList.add("on");
      document.getElementById("tabChat").classList.remove("on");
      document.getElementById("viewAdmin").classList.remove("hide");
      document.getElementById("viewChat").classList.add("hide");
    };

    async function send() {
      const el = document.getElementById("input");
      const content = el.value.trim();
      if (!content) return;
      el.value = "";
      bubble("user", content);
      try {
        const r = await api("/v1/chat", { method: "POST", body: JSON.stringify({ content, chatId: "lite", userId: "lite-user" }) });
        bubble("assistant", r.assistant);
      } catch (e) {
        bubble("assistant", "失败：" + e.message);
      }
    }
    document.getElementById("send").onclick = send;
    document.getElementById("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });

    function showAdmin() {
      document.getElementById("loginBox").classList.toggle("hide", !!token);
      document.getElementById("setupBox").classList.toggle("hide", !(token && mustReconfigure));
      document.getElementById("okBox").classList.toggle("hide", !(token && !mustReconfigure));
    }

    document.getElementById("loginBtn").onclick = async () => {
      document.getElementById("loginErr").textContent = "";
      try {
        const r = await api("/v1/admin/login", {
          method: "POST",
          body: JSON.stringify({
            username: document.getElementById("user").value,
            password: document.getElementById("pass").value,
          }),
        });
        token = r.token;
        mustReconfigure = !!r.mustReconfigure;
        document.getElementById("pass").value = "";
        showAdmin();
        if (!mustReconfigure) {
          const ov = await api("/v1/admin/overview", { token });
          document.getElementById("overview").textContent = JSON.stringify(ov, null, 2);
          document.getElementById("okMsg").textContent = "已登录（内存会话，刷新即失效）";
        }
      } catch (e) {
        document.getElementById("loginErr").textContent = e.message;
      }
    };

    document.getElementById("setupBtn").onclick = async () => {
      document.getElementById("setupErr").textContent = "";
      try {
        await api("/v1/admin/setup-credentials", {
          method: "POST",
          token,
          body: JSON.stringify({
            username: document.getElementById("su").value,
            password: document.getElementById("sp").value,
            confirmPassword: document.getElementById("sp2").value,
          }),
        });
        token = "";
        mustReconfigure = false;
        showAdmin();
        document.getElementById("loginErr").textContent = "";
        alert("已保存，请用新账号重新登录");
      } catch (e) {
        document.getElementById("setupErr").textContent = e.message;
      }
    };

    document.getElementById("logoutBtn").onclick = () => {
      token = "";
      mustReconfigure = false;
      showAdmin();
    };
  </script>
</body>
</html>
